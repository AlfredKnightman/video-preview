<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; display:flex; align-items:center; justify-content:center; font-family:-apple-system,system-ui,sans-serif; }
  .wrap { width:100%; max-width:960px; padding:16px; }
  video { width:100%; border-radius:12px; display:block; box-shadow:0 24px 80px rgba(0,0,0,0.8); }
  .meta { text-align:center; margin-top:14px; color:rgba(255,255,255,0.35); font-size:13px; letter-spacing:0.03em; }
</style>
</head>
<body>
<div class="wrap">
  <video id="v" controls playsinline preload="metadata">
    <source id="src" src="" type="video/mp4">
    Your browser doesn't support HTML5 video.
  </video>
  <p class="meta" id="label"></p>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const src = p.get('src');
  const label = p.get('label') || '';
  if (src) {
    document.getElementById('src').src = decodeURIComponent(src);
    document.getElementById('v').load();
    document.title = label || 'Preview';
    document.getElementById('label').textContent = label;
  } else {
    document.body.innerHTML = '<p style="color:rgba(255,255,255,0.3);font-family:monospace;font-size:14px;padding:40px">No video. Add ?src=VIDEO_URL to the URL.</p>';
  }
</script>
</body>
</html>
